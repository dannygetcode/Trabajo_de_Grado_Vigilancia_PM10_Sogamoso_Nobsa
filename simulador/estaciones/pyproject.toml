[project]
name = "svca-simulador"
version = "0.1.0"
description = "Simulador de estaciones: reproduce históricos e inyecta fallas."
requires-python = ">=3.13,<3.14"
dependencies = [
    "svca-comun",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "svca_simulador"
module-root = ""

[tool.uv.sources]
svca-comun = { workspace = true }
