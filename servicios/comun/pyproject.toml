[project]
name = "svca-comun"
version = "0.1.0"
description = "Piezas compartidas sin reglas de negocio: configuración, errores, salud, base de datos, reloj y tokens."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "svca_comun"
module-root = ""
