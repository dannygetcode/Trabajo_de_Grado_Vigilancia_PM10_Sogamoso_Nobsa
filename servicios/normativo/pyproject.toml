[project]
name = "svca-normativo"
version = "0.1.0"
description = "Servicio normativo: promedios móviles, evaluación y declaratorias."
requires-python = ">=3.13,<3.14"
dependencies = [
    "svca-comun",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "svca_normativo"
module-root = ""

[tool.uv.sources]
svca-comun = { workspace = true }
